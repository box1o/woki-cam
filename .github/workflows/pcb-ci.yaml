name: PCB CI

on:
  push:
    branches: [main, dev, release]
    paths-ignore:
      - 'images/woki-cam-3d.png'
  pull_request:
    branches: [main, dev, release]
  workflow_dispatch:
    inputs:
      full_outputs:
        description: Full KiBot outputs (STEP, ray-traced 3D, iBOM, review PDF)
        type: boolean
        default: false
      publish_release:
        description: Publish a GitHub release
        type: boolean
        default: false

concurrency:
  group: pcb-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SETTINGS_FILE: settings.env
  # Pin the KiCad 10 / KiBot build used to validate the compatibility shim.
  KIBOT_IMAGE: ghcr.io/inti-cmnb/kicad10_auto_full:dev@sha256:114c9c3cc09d0ebb491d3afafb8995ab180fecbedb55d7ab6667960b8680076a

jobs:
  kibot:
    name: KiBot — ${{ matrix.board }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: power
            pcb: boards/01-power/power.kicad_pcb
            sch: boards/01-power/power.kicad_sch
          - board: fpga_control
            pcb: boards/02-fpga-control/fpga_control.kicad_pcb
            sch: boards/02-fpga-control/fpga_control.kicad_sch
          - board: camera
            pcb: boards/03-camera/camera.kicad_pcb
            sch: boards/03-camera/camera.kicad_sch
          - board: ir_led
            pcb: boards/04-ir-led/ir_led.kicad_pcb
            sch: boards/04-ir-led/ir_led.kicad_sch

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify persistent MagJack 3D model association
        if: matrix.board == 'power'
        run: python3 .github/verify-magjack-model.py

      - name: Check schematic electrical rules (ERC)
        env:
          SCHEMATIC: ${{ matrix.sch }}
        run: |
          mkdir -p "build/${{ matrix.board }}/checks"
          docker run --rm -v "$PWD:/work" -w /work \
            --entrypoint kicad-cli "$KIBOT_IMAGE" \
            sch erc --exit-code-violations -f json \
            -o "build/${{ matrix.board }}/checks/erc.json" "$SCHEMATIC"

      - name: Check PCB design rules (DRC)
        env:
          PCB: ${{ matrix.pcb }}
        run: |
          mkdir -p "build/${{ matrix.board }}/checks"
          docker run --rm -v "$PWD:/work" -w /work \
            --entrypoint kicad-cli "$KIBOT_IMAGE" \
            pcb drc --exit-code-violations -f json \
            -o "build/${{ matrix.board }}/checks/drc.json" "$PCB"

      - name: Generate board outputs
        env:
          BOARD_NAME: ${{ matrix.board }}
          PCB: ${{ matrix.pcb }}
          SCHEMATIC: ${{ matrix.sch }}
          OUTPUT_GROUP: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' || inputs.full_outputs || inputs.publish_release) && 'release' || 'ci' }}
        run: |
          docker run --rm \
            -e BOARD_NAME -e CI -e GITHUB_ACTIONS \
            -v "$PWD:/work" -w /work \
            --entrypoint python3 "$KIBOT_IMAGE" \
            .github/run-kibot.py -v -c .github/kibot.yaml -d . \
            -b "$PCB" -e "$SCHEMATIC" -s erc,drc "$OUTPUT_GROUP"

      - if: always()
        run: sudo chown -R "$USER:$USER" build

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: board-${{ matrix.board }}
          path: build/
          compression-level: 1
          if-no-files-found: error

  package:
    name: Package
    needs: kibot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.prepare-release.outputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: board-*
          path: build
          merge-multiple: true

      - name: Build manufacturing ZIP and previews
        run: |
          python3 -m venv "$RUNNER_TEMP/woki-packaging"
          "$RUNNER_TEMP/woki-packaging/bin/python" -m pip install --quiet pillow
          "$RUNNER_TEMP/woki-packaging/bin/python" .github/package.py

      - name: Prepare and validate release assets without publishing
        id: prepare-release
        run: |
          source "$SETTINGS_FILE"
          tag="${RELEASE_TAG_PREFIX}-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          test -s "build/release/${PACKAGE_NAME}.zip"
          test -s build/docs/woki-cam-schematic.pdf
          test -s build/images/woki-cam-3d.png
          RELEASE_TAG="$tag" PACKAGE_NAME="$PACKAGE_NAME" \
            RELEASE_NOTES=build/release/release-notes.md bash .github/release-notes.sh
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: woki-cam-outputs
          path: build/
          compression-level: 1
          if-no-files-found: error

  update-preview:
    name: Update README 3D preview
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v7
        with:
          name: woki-cam-outputs
          path: build/
      - name: Publish latest successful main preview
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s build/images/woki-cam-3d.png
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo "Main advanced since this run; skip stale preview."
            exit 0
          fi
          mkdir -p images
          cp build/images/woki-cam-3d.png images/woki-cam-3d.png
          if git diff --quiet -- images/woki-cam-3d.png; then
            echo "Preview unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/woki-cam-3d.png
          git commit -m "docs: refresh 3D preview from latest main build"
          git push origin HEAD:main

  release:
    name: Release
    needs: package
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: woki-cam-outputs
          path: build/

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          source "$SETTINGS_FILE"
          gh release create "$RELEASE_TAG" \
            "build/release/${PACKAGE_NAME}.zip#Manufacturing package" \
            "build/docs/woki-cam-schematic.pdf#Schematic PDF" \
            "build/images/woki-cam-3d.png#3D collage" \
            --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
            --notes-file build/release/release-notes.md
