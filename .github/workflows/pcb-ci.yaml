name: PCB CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'images/woki-cam-3d.png'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_outputs:
        description: Full KiBot outputs (STEP, ray-traced 3D, iBOM, review PDF)
        type: boolean
        default: false
      publish_release:
        description: Publish a GitHub release
        type: boolean
        default: false

concurrency:
  group: pcb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SETTINGS_FILE: settings.env
  # Official KiCad symbol libraries 10.0.8, matching the project editor.
  KICAD_SYMBOLS_COMMIT: 45efbd93be87e365a21d743daf9b8a07e6414df6
  # Pin the KiCad 10 / KiBot build used to validate the compatibility shim.
  KIBOT_IMAGE: ghcr.io/inti-cmnb/kicad10_auto_full:dev@sha256:114c9c3cc09d0ebb491d3afafb8995ab180fecbedb55d7ab6667960b8680076a

jobs:
  schematic:
    name: Schematic ERC — ${{ matrix.board }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: power
            pcb: boards/01-power/power.kicad_pcb
            sch: boards/01-power/power.kicad_sch
          - board: fpga-control
            pcb: boards/02-fpga-control/fpga-control.kicad_pcb
            sch: boards/02-fpga-control/fpga-control.kicad_sch
          - board: camera
            pcb: boards/03-camera/camera.kicad_pcb
            sch: boards/03-camera/camera.kicad_sch
          - board: ir-led
            pcb: boards/04-ir-led/ir-led.kicad_pcb
            sch: boards/04-ir-led/ir-led.kicad_sch

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare matching official symbol libraries
        run: |
          symbol_source="$RUNNER_TEMP/kicad-symbols-source"
          git init --quiet "$symbol_source"
          git -C "$symbol_source" remote add origin https://gitlab.com/kicad/libraries/kicad-symbols.git
          git -C "$symbol_source" fetch --quiet --depth 1 origin "$KICAD_SYMBOLS_COMMIT"
          git -C "$symbol_source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$symbol_source" rev-parse HEAD)" = "$KICAD_SYMBOLS_COMMIT"
          python3 "$symbol_source/tools/kicad_lib_pack.py" \
            -i "$symbol_source" -o "$RUNNER_TEMP/kicad-symbols-packed"

      - name: Check schematic electrical rules (ERC)
        env:
          SCHEMATIC: ${{ matrix.sch }}
        run: |
          mkdir -p "build/${{ matrix.board }}/checks"
          docker run --rm -v "$PWD:/work" -w /work \
            -v "$RUNNER_TEMP/kicad-symbols-packed:/usr/share/kicad/symbols:ro" \
            --entrypoint kicad-cli "$KIBOT_IMAGE" \
            sch erc --exit-code-violations --format json \
            -o "build/${{ matrix.board }}/checks/erc.json" "$SCHEMATIC"

      - name: Restore report ownership
        if: always()
        run: |
          if [ -d build ]; then
            sudo chown -R "$USER:$USER" build
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: schematic-${{ matrix.board }}
          path: build/
          if-no-files-found: error

  kibot:
    name: PCB layout and outputs — ${{ matrix.board }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: power
            pcb: boards/01-power/power.kicad_pcb
            sch: boards/01-power/power.kicad_sch
          - board: fpga-control
            pcb: boards/02-fpga-control/fpga-control.kicad_pcb
            sch: boards/02-fpga-control/fpga-control.kicad_sch
          - board: camera
            pcb: boards/03-camera/camera.kicad_pcb
            sch: boards/03-camera/camera.kicad_sch
          - board: ir-led
            pcb: boards/04-ir-led/ir-led.kicad_pcb
            sch: boards/04-ir-led/ir-led.kicad_sch

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify persistent MagJack 3D model association
        if: matrix.board == 'power'
        run: python3 .github/verify-magjack-model.py

      - name: Generate PCB design-rule report (DRC)
        if: success() || failure()
        env:
          PCB: ${{ matrix.pcb }}
        run: |
          mkdir -p "build/${{ matrix.board }}/checks"
          docker run --rm -v "$PWD:/work" -w /work \
            --entrypoint kicad-cli "$KIBOT_IMAGE" \
            pcb drc --format json \
            -o "build/${{ matrix.board }}/checks/drc.json" "$PCB"

      - name: Report draft layout status
        if: success() || failure()
        run: python3 .github/check-layout.py "build/${{ matrix.board }}"

      - name: Generate board outputs
        if: success() || failure()
        env:
          BOARD_NAME: ${{ matrix.board }}
          PCB: ${{ matrix.pcb }}
          SCHEMATIC: ${{ matrix.sch }}
          OUTPUT_GROUP: ${{ (inputs.full_outputs || inputs.publish_release) && 'release' || 'ci' }}
        run: |
          docker run --rm \
            -e BOARD_NAME -e CI -e GITHUB_ACTIONS \
            -v "$PWD:/work" -w /work \
            --entrypoint python3 "$KIBOT_IMAGE" \
            .github/run-kibot.py -v -c .github/kibot.yaml -d . \
            -b "$PCB" -e "$SCHEMATIC" -s erc,drc "$OUTPUT_GROUP"

      - if: always()
        run: |
          if [ -d build ]; then
            sudo chown -R "$USER:$USER" build
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: board-${{ matrix.board }}
          path: build/
          compression-level: 1
          if-no-files-found: error

  package:
    name: Package
    needs: [schematic, kibot]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.prepare-release.outputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: board-*
          path: build
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          pattern: schematic-*
          path: build
          merge-multiple: true

      - name: Build draft ZIP and previews
        run: |
          python3 -m venv "$RUNNER_TEMP/woki-packaging"
          "$RUNNER_TEMP/woki-packaging/bin/python" -m pip install --quiet pillow
          "$RUNNER_TEMP/woki-packaging/bin/python" .github/package.py

      - name: Prepare and validate release assets without publishing
        id: prepare-release
        run: |
          # shellcheck source=settings.env
          source "$SETTINGS_FILE"
          tag="${RELEASE_TAG_PREFIX}-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          test -s "build/release/${PACKAGE_NAME}.zip"
          test -s build/docs/woki-cam-schematic.pdf
          test -s build/images/woki-cam-3d.png
          RELEASE_TAG="$tag" PACKAGE_NAME="$PACKAGE_NAME" \
            RELEASE_NOTES=build/release/release-notes.md bash .github/release-notes.sh
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: woki-cam-outputs
          path: build/
          compression-level: 1
          if-no-files-found: error

  update-preview:
    name: Update README 3D preview
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v7
        with:
          name: woki-cam-outputs
          path: build/
      - name: Publish latest successful main preview
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s build/images/woki-cam-3d.png
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo "Main advanced since this run; skip stale preview."
            exit 0
          fi
          mkdir -p images
          cp build/images/woki-cam-3d.png images/woki-cam-3d.png
          if git diff --quiet -- images/woki-cam-3d.png; then
            echo "Preview unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/woki-cam-3d.png
          git commit -m "docs: refresh 3d preview from latest main build"
          git push origin HEAD:main

  release:
    name: Release
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: woki-cam-outputs
          path: build/

      - name: Require clean PCB layouts before manufacturing release
        run: python3 .github/check-layout.py build --strict --expected-reports 4

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          # shellcheck source=settings.env
          source "$SETTINGS_FILE"
          gh release create "$RELEASE_TAG" \
            "build/release/${PACKAGE_NAME}.zip#Manufacturing package" \
            "build/docs/woki-cam-schematic.pdf#Schematic PDF" \
            "build/images/woki-cam-3d.png#3D collage" \
            --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
            --notes-file build/release/release-notes.md
